<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSM-5-TR Clinician Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1f2a2e; --muted:#66727a; --line:#e2ded5;
  --accent:#2f6f6a; --accent-soft:#e3efed; --warn:#9a5b16; --warn-soft:#fbf1e3; --star:#c98a1b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141a1c; --panel:#1c2427; --ink:#e7ecee; --muted:#9aa7ad; --line:#2c373b;
    --accent:#6fb8b0; --accent-soft:#1f3433; --warn:#e0a35c; --warn-soft:#2e2619; --star:#e3ae4a; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:650;margin:0}
.app{max-width:980px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font-size:20px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.sync.on b{background:#3aa676}
.search{margin-top:10px;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.search svg{position:absolute;left:11px;top:11px;opacity:.5}
.seg{display:flex;gap:4px;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:7px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.seg button.on{color:#0f1a19}}
main{flex:1;padding:14px 16px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.chap{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 14px;border:0;background:transparent;text-align:left}
.chap h3{font-size:16px}
.chap .n{font-size:12px;color:var(--muted)}
.chap .chev{transition:transform .15s;opacity:.5}
.chap[aria-expanded=true] .chev{transform:rotate(90deg)}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row .nm{flex:1}
.row.flash{animation:fl 1.6s}
@keyframes fl{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
.code{font:500 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px;white-space:nowrap}
.marks{display:flex;gap:4px;font-size:13px;color:var(--star)}
.marks .nt{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty h3{color:var(--ink);margin-bottom:6px}
.detail h2{font-size:24px;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 4px;color:var(--muted);font-size:13px}
.link{border:0;background:none;color:var(--accent);padding:0;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:9px;font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#0f1a19}}
.btn.bm-on{border-color:var(--star);color:var(--star)}
section.blk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
section.blk h3{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{font-size:12.5px;color:var(--muted)}
.ov{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
textarea,input.f{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:10px;font:inherit;resize:vertical}
textarea{min-height:120px}
.crit-text{white-space:pre-wrap}
.saved{font-size:12px;color:var(--muted);font-weight:400;font-family:Inter,sans-serif}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .col{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.cmp .col h4{margin:0 0 4px;font-family:"Source Serif 4",serif;font-size:15px}
select.f{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.list-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px}
.list-item:last-child{border-bottom:0}
.list-item .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.list-item .s{color:var(--muted);font-size:13.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{display:flex;max-width:980px;width:100%}
.tabbar button{flex:1;border:0;background:none;padding:9px 4px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--accent);font-weight:600}
.tabbar svg{width:21px;height:21px}
.foot{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>DSM-5-TR Companion</h1><span class="sync" id="sync"><b></b>Saved on this device</span></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search disorder name or ICD-10-CM code (e.g. F43.10)" autocomplete="off">
    </div>
    <div class="seg" role="tablist">
      <button id="segClass" class="on">Classification</button>
      <button id="segCrit">Diagnostic Criteria</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabbar"><div class="inner">
  <button data-tab="classification" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Classification</button>
  <button data-tab="criteria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Criteria</button>
  <button data-tab="bookmarks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Read Later</button>
  <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Notes</button>
</div></nav>
<div class="toast" id="toast"></div>

/* ---------- Index ---------- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const DIS = {}; const ORDER = [];
CHAPTERS.forEach(([chap, list], ci) => list.forEach(([name, code, ov, rel]) => {
  const id = slug(name);
  if (DIS[id]) { DIS[id].alsoIn = chap; return; } // cross-listed (e.g., Antisocial PD)
  DIS[id] = {id, name, code, ov, rel, chap, ci}; ORDER.push(id);
}));

/* ---------- State & storage ---------- */
let S = { tab:'classification', sel:null, open:{}, q:'', cmp:null, flash:null };
let U = {};               // user data: id -> {bm, note, crit, pg, ts}
const LS = 'dsm-companion-v1';
try { U = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch(e) {}
let col = null;           // cloud collection (private to the signed-in user)
const timers = {};

function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(U)); } catch(e) {} }
function put(id, patch){
  U[id] = Object.assign({}, U[id] || {}, patch, {ts: Date.now()});
  saveLocal();
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => {
    if (!col) return;
    try { Promise.resolve(col.doc(id).set(U[id])).catch(()=>{}); } catch(e) {}
  }, 600);
}
async function initCloud(){
  try {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    col = db.collection('data/users/' + uid);
    let loaded = false;
    const timeout = setTimeout(() => { if (!loaded) setSync(false); }, 10000);
    col.onSnapshot(snap => {
      loaded = true; clearTimeout(timeout);
      const docs = Array.isArray(snap) ? snap : (snap && snap.docs) || [];
      let changed = false;
      docs.forEach(d => {
        const id = d.id; const data = typeof d.data === 'function' ? d.data() : (d.data || d);
        if (!id || !DIS[id] || !data) return;
        const local = U[id];
        if (!local || (data.ts || 0) > (local.ts || 0)) { U[id] = data; changed = true; }
      });
      // push any local-only items up once
      Object.keys(U).forEach(id => { if (!docs.find(d => d.id === id) && DIS[id]) { try { col.doc(id).set(U[id]); } catch(e){} } });
      saveLocal(); setSync(true);
      if (changed && !isTyping()) render();
    }, () => { clearTimeout(timeout); setSync(false); });
  } catch(e) { setSync(false); }
}
function setSync(on){
  const el = document.getElementById('sync');
  el.className = 'sync' + (on ? ' on' : '');
  el.innerHTML = '<b></b>' + (on ? 'Synced to your account' : 'Saved on this device');
}
const isTyping = () => { const a = document.activeElement; return a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.id !== 'q')); };

/* ---------- Helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const ago = ts => { if (!ts) return ''; const m = Math.round((Date.now()-ts)/60000);
  if (m < 1) return 'just now'; if (m < 60) return m+'m ago'; const h = Math.round(m/60); if (h < 24) return h+'h ago';
  return new Date(ts).toLocaleDateString(); };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1600); }
function matches(d, q){ q = q.trim().toLowerCase(); if (!q) return true;
  const n = q.replace(/\s/g,''); return d.name.toLowerCase().includes(q) || d.code.toLowerCase().replace(/\s/g,'').includes(n) || d.chap.toLowerCase().includes(q); }
function marks(id){ const u = U[id] || {}; return `<span class="marks">${u.bm?'★':''}${(u.note||'').trim()?'<span class="nt">✎</span>':''}</span>`; }

/* ---------- Views ---------- */
function vClassification(){
  const q = S.q;
  let html = '';
  CHAPTERS.forEach(([chap, list], ci) => {
    const items = list.map(x => DIS[slug(x[0])]).filter((d,i,a) => d && matches(d,q) && a.indexOf(d)===i);
    if (!items.length) return;
    const open = q ? true : !!S.open[ci];
    html += `<div class="card"><button class="chap" data-chap="${ci}" aria-expanded="${open}">
      <div><h3>${esc(chap)}</h3><div class="n">${items.length} ${items.length===1?'entry':'entries'}</div></div>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></button>`;
    if (open) html += `<div class="rows">` + items.map(d =>
      `<button class="row${S.flash===d.id?' flash':''}" data-open="${d.id}" id="r-${d.id}"><span class="nm">${esc(d.name)}</span>${marks(d.id)}<span class="code">${esc(d.code.split(' (')[0])}</span></button>`).join('') + `</div>`;
    html += `</div>`;
  });
  if (!html) html = `<div class="empty"><h3>No matches</h3>Try a different name or code.</div>`;
  return `<div class="notice">Classification lists DSM-5-TR names and ICD-10-CM codes. Always confirm codes against the current manual and ICD-10-CM update before billing.</div>` + html + foot();
}

function critBlock(d, editable){
  const u = U[d.id] || {};
  if (!editable) {
    return u.crit && u.crit.trim()
      ? `<div class="crit-text">${esc(u.crit)}</div>${u.pg?`<div class="hint" style="margin-top:6px">Manual p. ${esc(u.pg)}</div>`:''}`
      : `<div class="hint">No criteria reference saved yet.</div>`;
  }
  return `<textarea id="crit" placeholder="Type or paste the criteria from your licensed DSM-5-TR (print, DSM Library, or app) so you can review them here alongside your notes.">${esc(u.crit||'')}</textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><span class="hint" style="white-space:nowrap">Manual page</span><input class="f" id="pg" style="max-width:120px;padding:7px 10px" value="${esc(u.pg||'')}" placeholder="e.g. 183"></div>`;
}

function vCriteria(){
  if (S.q && !S.sel) return vSearchResults();
  const d = DIS[S.sel];
  if (!d) return `<div class="empty"><h3>Pick a diagnosis</h3>Choose one from Classification, or search above, to see its criteria workspace.<div style="margin-top:14px"><button class="btn primary" data-tab="classification">Browse Classification</button></div></div>`;
  const u = U[d.id] || {};
  const rel = d.rel.map(n => DIS[slug(n)]).filter(Boolean);
  const cmp = S.cmp && DIS[S.cmp];
  const opts = ORDER.filter(id => id !== d.id).map(id => `<option value="${id}"${S.cmp===id?' selected':''}>${esc(DIS[id].name)} — ${esc(DIS[id].code.split(' (')[0])}</option>`).join('');
  return `<div class="detail">
    <h2>${esc(d.name)}</h2>
    <div class="meta"><span class="code">${esc(d.code)}</span>
      <button class="link" data-reveal="${d.id}">${esc(d.chap)}</button>${d.alsoIn?`<span>· also listed in ${esc(d.alsoIn)}</span>`:''}</div>
    <div class="actions">
      <button class="btn ${u.bm?'bm-on':''}" data-bm="${d.id}">${u.bm?'★ In Read Later':'☆ Read Later'}</button>
      <button class="btn" data-reveal="${d.id}">↩ Show in Classification</button>
    </div>
    ${d.ov?`<section class="blk"><h3>Clinical overview</h3><p class="ov">${esc(d.ov)}</p><div class="hint" style="margin-top:6px">Plain-language summary for orientation only — not the DSM criteria.</div></section>`:''}
    <section class="blk"><h3>Diagnostic criteria <span class="saved" id="critSaved">${u.crit?'Saved':''}</span></h3>${critBlock(d,true)}</section>
    ${rel.length?`<section class="blk"><h3>Cross-reference / differentials</h3><div class="chips">${rel.map(r=>`<button class="chip" data-open="${r.id}">${esc(r.name)} <span style="opacity:.6">${esc(r.code.split(' (')[0])}</span></button>`).join('')}</div></section>`:''}
    <section class="blk"><h3>Compare side by side</h3>
      <select class="f" id="cmpSel"><option value="">Choose a diagnosis to compare…</option>
      ${rel.length?`<optgroup label="Differentials">${rel.map(r=>`<option value="${r.id}"${S.cmp===r.id?' selected':''}>${esc(r.name)}</option>`).join('')}</optgroup>`:''}
      <optgroup label="All diagnoses">${opts}</optgroup></select>
      ${cmp?`<div class="cmp">
        <div class="col"><h4>${esc(d.name)}</h4><div class="code" style="display:inline-block;margin-bottom:6px">${esc(d.code.split(' (')[0])}</div>${critBlock(d,false)}</div>
        <div class="col"><h4>${esc(cmp.name)}</h4><div class="code" style="display:inline-block;margin-bottom:6px">${esc(cmp.code.split(' (')[0])}</div>${critBlock(cmp,false)}
          <div style="margin-top:8px"><button class="link" data-open="${cmp.id}">Open ${esc(cmp.name)}</button></div></div>
      </div>`:''}
    </section>
    <section class="blk"><h3>My notes <span class="saved" id="noteSaved">${u.note?'Saved '+ago(u.ts):''}</span></h3>
      <textarea id="note" placeholder="Clinical reasoning, differential thoughts, reminders, readings to follow up on…">${esc(u.note||'')}</textarea>
      <div class="hint" style="margin-top:6px">Keep client identifiers out of notes.</div></section>
  </div>` + foot();
}

function vSearchResults(){
  const res = ORDER.map(id=>DIS[id]).filter(d=>matches(d,S.q));
  if (!res.length) return `<div class="empty"><h3>No matches</h3>Try a different name or code.</div>`;
  return `<div class="card">${res.map(d=>`<button class="row" data-open="${d.id}"><span class="nm">${esc(d.name)}<div class="hint">${esc(d.chap)}</div></span>${marks(d.id)}<span class="code">${esc(d.code.split(' (')[0])}</span></button>`).join('')}</div>`;
}

function vBookmarks(){
  const items = ORDER.filter(id => U[id] && U[id].bm && matches(DIS[id], S.q)).sort((a,b)=>(U[b].ts||0)-(U[a].ts||0));
  if (!items.length) return `<div class="empty"><h3>Nothing saved to read later</h3>Tap “☆ Read Later” on any diagnosis to save it here.</div>`;
  return `<div class="card">${items.map(id=>{const d=DIS[id];return `<div style="display:flex;align-items:center;border-bottom:1px solid var(--line)">
    <button class="list-item" data-open="${id}" style="border:0"><div class="t"><span>${esc(d.name)}</span><span class="code">${esc(d.code.split(' (')[0])}</span></div><div class="s">${esc(d.chap)}</div></button>
    <button class="btn" style="margin-right:10px;border:0;color:var(--star)" data-bm="${id}" aria-label="Remove">★</button></div>`}).join('')}</div>`;
}

function vNotes(){
  const items = ORDER.filter(id => U[id] && ((U[id].note||'').trim() || (U[id].crit||'').trim()))
    .filter(id => { const q=S.q.trim().toLowerCase(); return !q || matches(DIS[id],q) || (U[id].note||'').toLowerCase().includes(q); })
    .sort((a,b)=>(U[b].ts||0)-(U[a].ts||0));
  if (!items.length) return `<div class="empty"><h3>No notes yet</h3>Open any diagnosis and write in “My notes” — everything you write shows up here, newest first.</div>`;
  return `<div class="card">${items.map(id=>{const d=DIS[id],u=U[id];return `<button class="list-item" data-open="${id}">
    <div class="t"><span>${esc(d.name)}</span><span class="hint" style="font-weight:400">${ago(u.ts)}</span></div>
    <div class="s">${esc((u.note||'').trim() || 'Criteria reference saved')}</div></button>`}).join('')}</div>`;
}

function foot(){ return `<p class="foot">DSM-5-TR is © American Psychiatric Association. This companion does not reproduce DSM diagnostic criteria; it provides the classification structure and codes, and a private space for criteria you enter from your own licensed copy. It is a reference aid and does not replace clinical judgment.</p>`; }

/* ---------- Render & events ---------- */
function render(){
  const v = {classification:vClassification, criteria:vCriteria, bookmarks:vBookmarks, notes:vNotes}[S.tab];
  $('#main').innerHTML = v();
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  $('#segClass').classList.toggle('on', S.tab === 'classification');
  $('#segCrit').classList.toggle('on', S.tab === 'criteria');
  bindFields();
  if (S.flash) { const el = document.getElementById('r-'+S.flash); if (el) el.scrollIntoView({block:'center'}); S.flash = null; }
}
function go(tab){ S.tab = tab; render(); window.scrollTo(0,0); }
function openDis(id){ if (S.sel !== id) S.cmp = null; S.sel = id; S.q = ''; $('#q').value=''; go('criteria'); }

function bindFields(){
  const note = $('#note'), crit = $('#crit'), pg = $('#pg'), cmpSel = $('#cmpSel');
  if (note) note.oninput = () => { put(S.sel, {note: note.value}); $('#noteSaved').textContent = 'Saved'; };
  if (crit) crit.oninput = () => { put(S.sel, {crit: crit.value}); $('#critSaved').textContent = 'Saved'; };
  if (pg) pg.oninput = () => put(S.sel, {pg: pg.value});
  if (cmpSel) cmpSel.onchange = () => { S.cmp = cmpSel.value || null; render(); };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-chap],[data-bm],[data-reveal],[data-tab]');
  if (!t) return;
  if (t.dataset.open) return openDis(t.dataset.open);
  if (t.dataset.chap) { S.open[t.dataset.chap] = !S.open[t.dataset.chap]; return render(); }
  if (t.dataset.bm) { const id = t.dataset.bm, on = !(U[id]&&U[id].bm); put(id, {bm:on}); toast(on?'Saved to Read Later':'Removed from Read Later'); return render(); }
  if (t.dataset.reveal) { const d = DIS[t.dataset.reveal]; S.open[d.ci] = true; S.flash = d.id; S.q=''; $('#q').value=''; S.tab='classification'; return render(); }
  if (t.dataset.tab) return go(t.dataset.tab);
});
$('#segClass').onclick = () => { if (S.sel) { const d = DIS[S.sel]; S.open[d.ci] = true; S.flash = d.id; } S.tab='classification'; render(); };
$('#segCrit').onclick = () => go('criteria');
$('#q').addEventListener('input', e => { S.q = e.target.value; if (S.tab==='criteria') S.sel = S.q ? null : S.sel; render(); });

render();
initCloud();
</script>
</body>
